name: Regenerate goldens (temp)

on:
  workflow_dispatch: {}

jobs:
  regen:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - name: Authenticate game-shell dependency
        env:
          GAME_SHELL_TOKEN: ${{ secrets.GAME_SHELL_TOKEN }}
        run: >-
          git config --global
          url."https://x-access-token:${GAME_SHELL_TOKEN}@github.com/NelsonGrey/game-shell".insteadOf
          "https://github.com/NelsonGrey/game-shell"
      - run: flutter pub get
      - run: flutter test --update-goldens test/intercept_echo_preview_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-goldens
          path: packages/mobile/test/goldens/*.png
